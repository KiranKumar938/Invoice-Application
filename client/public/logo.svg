<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="kPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Subtle Circuit Traces in BG -->
  <path d="M 60 120 H 140 L 180 80" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="180" cy="80" r="4" fill="#38bdf8" fill-opacity="0.5"/>
  <path d="M 452 392 H 372 L 332 432" stroke="#fb923c" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="332" cy="432" r="4" fill="#fb923c" fill-opacity="0.5"/>

  <!-- Rotating Cybernetic Outer Hooks -->
  <!-- Top-Left Blade (Cyan-Blue) -->
  <path d="M 170 120 C 130 150 110 200 115 250 C 120 220 150 180 200 170 Z" fill="url(#cyanBlueGrad)" filter="url(#neonGlow)"/>
  <circle cx="170" cy="120" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="3"/>
  <line x1="170" y1="120" x2="110" y2="180" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="110" cy="180" r="6" fill="#38bdf8"/>

  <!-- Top-Right Blade (Orange-Amber) -->
  <path d="M 392 170 C 422 210 422 260 397 312 C 392 282 362 252 342 202 Z" fill="url(#orangeGrad)" filter="url(#neonGlow)"/>
  <circle cx="392" cy="170" r="10" fill="#fb923c" stroke="#ffffff" stroke-width="3"/>
  <line x1="392" y1="170" x2="432" y2="210" stroke="#fb923c" stroke-width="4"/>
  <circle cx="432" cy="210" r="6" fill="#fb923c"/>

  <!-- Bottom-Left Blade (Purple-Violet) -->
  <path d="M 120 342 C 90 302 90 252 115 200 C 120 230 150 260 170 310 Z" fill="url(#purpleGrad)" filter="url(#neonGlow)"/>
  <circle cx="120" cy="342" r="10" fill="#c084fc" stroke="#ffffff" stroke-width="3"/>
  <line x1="120" y1="342" x2="80" y2="302" stroke="#c084fc" stroke-width="4"/>
  <circle cx="80" cy="302" r="6" fill="#c084fc"/>

  <!-- Bottom-Right Blade (Magenta-Orange) -->
  <path d="M 342 392 C 382 362 402 312 397 262 C 392 292 362 332 312 342 Z" fill="url(#orangeGrad)" filter="url(#neonGlow)"/>
  <circle cx="342" cy="392" r="10" fill="#fb923c" stroke="#ffffff" stroke-width="3"/>
  <line x1="342" y1="392" x2="402" y2="332" stroke="#fb923c" stroke-width="4"/>
  <circle cx="402" cy="332" r="6" fill="#fb923c"/>

  <!-- Central Diamond Shield -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-95" y="-95" width="190" height="190" rx="20" fill="url(#kPlateGrad)" stroke="url(#cyanBlueGrad)" stroke-width="8" filter="url(#neonGlow)"/>
    <rect x="-80" y="-80" width="160" height="160" rx="14" fill="none" stroke="url(#orangeGrad)" stroke-width="4" stroke-dasharray="14 8"/>
  </g>

  <!-- Central 'K' Monogram -->
  <g filter="url(#neonGlow)">
    <path d="M 215 195 V 317" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <path d="M 297 195 L 235 256 L 305 317" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 270 256 L 315 317" stroke="#fb923c" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
